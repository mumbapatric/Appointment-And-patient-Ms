spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/appointment_Ms
    username: ${db_username}
    password: ${db_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    prefix: classpath:/templates/   # Location of your templates
    suffix: .html                   # File extension for your templates
    cache: false

    jwt:
      secret-key: ${JWT_SECRET_KEY}




  mail:
    host: smtp.gmail.com
    port: 587
    username: ${email_user}
    password: ${email_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

twilio:
  account:
    sid: ${sid}
  auth:
    token: ${token}
  phone:
    number: +15677575781

# API DOC
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


